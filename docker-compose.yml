services:
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: llamaindex-rag-pgvector
    environment:
      POSTGRES_DB: llama_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d llama_rag"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgvector_data:
